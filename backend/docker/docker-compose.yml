services:
  agent:
    build:
      context: .
      args:
        OPENCODE_VERSION: "${OPENCODE_VERSION:-2.0.22}"
    stdin_open: true
    tty: true
    working_dir: /work
    environment:
      PAG_CTX_TIER: "${PAG_CTX_TIER:-3}"
    volumes:
      - ${WORKSPACE:-../scratch-repo}:/work
      - ../build/${PROFILE:-strict}.json:/home/agent/.config/opencode/opencode.json:ro
      - ../AGENTS.global.md:/home/agent/.config/opencode/AGENTS.md:ro
      - ../plugins:/home/agent/.config/opencode/plugins:ro
      - opencode-config:/home/agent/.config/opencode
      - opencode-data:/home/agent/.local/share/opencode
    read_only: true
    tmpfs:
      - /tmp
      - /home/agent/.cache
      - /home/agent/.local/state
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 2g
    pids_limit: 256
    networks:
      - internal
    depends_on:
      llmproxy:
        condition: service_started
      egress:
        condition: service_started
      searxng:
        condition: service_started

  llmproxy:
    image: nginx:stable
    environment:
      - GO_API_KEY=${GO_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - ./llmproxy.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../logs:/var/log/nginx
    mem_limit: 128m
    networks:
      - internal
      - outbound

  egress:
    image: ubuntu/squid
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
      - ./allowlist.txt:/etc/squid/allowlist.txt:ro
    mem_limit: 128m
    networks:
      - internal
      - outbound

  searxng:
    image: searxng/searxng
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-autogenerated-change-me}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 256m
    networks:
      - internal
      - outbound

networks:
  internal:
    internal: true
  outbound: {}

volumes:
  opencode-config: {}
  opencode-data: {}
