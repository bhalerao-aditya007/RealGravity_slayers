[project]
name = "deskmates-bridge"
version = "0.1.0"
description = "Deskmates Bridge Server — gateway core implemented; the rest is specified in docs/BRIDGE_SPEC.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2.7", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
