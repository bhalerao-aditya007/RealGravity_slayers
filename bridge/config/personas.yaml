personas:
  - id: domain_expert
    name: "Domain Expert"
    initials: "DE"
    icon: "GraduationCap"
    color: "#2E7D32"
    lens: "Correct domain mechanics, standards, known constraints"
    output_rubric: "Concrete domain facts the approach relies on"
    preferred_build_role: "coder"

  - id: skeptic
    name: "Skeptic"
    initials: "SK"
    icon: "HelpCircle"
    color: "#C62828"
    lens: "Unsupported claims, hidden assumptions"
    output_rubric: "The weakest assumption + what would falsify it"
    preferred_build_role: "critic"

  - id: risk_analyst
    name: "Risk Analyst"
    initials: "RA"
    icon: "AlertTriangle"
    color: "#EF6C00"
    lens: "Failure modes, blast radius, rollback"
    output_rubric: "Top-3 risks with likelihood * impact"
    preferred_build_role: "redteam"

  - id: user_advocate
    name: "User Advocate"
    initials: "UA"
    icon: "User"
    color: "#1565C0"
    lens: "The end user's real workflow and pain"
    output_rubric: "Who is affected, acceptance from the user's view"
    preferred_build_role: "tester"

  - id: pragmatic_engineer
    name: "Pragmatic Engineer"
    initials: "PE"
    icon: "Wrench"
    color: "#00897B"
    lens: "Simplest thing that works, delivery risk"
    output_rubric: "Minimal viable path, what to cut"
    preferred_build_role: "coder"

  - id: security_auditor
    name: "Security & Privacy Auditor"
    initials: "SA"
    icon: "ShieldAlert"
    color: "#6A1B9A"
    lens: "Data exposure, injection, secrets, permissions"
    output_rubric: "Data-flow concerns and mitigations"
    preferred_build_role: "redteam"

  - id: systems_architect
    name: "Systems Architect"
    initials: "AR"
    icon: "Layers"
    color: "#3949AB"
    lens: "Interfaces, coupling, scaling, consistency"
    output_rubric: "Interface/contract sketch"
    preferred_build_role: "integrator"

  - id: test_engineer
    name: "Test & Verification Engineer"
    initials: "TE"
    icon: "CheckCircle"
    color: "#F9A825"
    lens: "How we would know it works"
    output_rubric: "Executable acceptance checks"
    preferred_build_role: "tester"

  - id: devils_advocate
    name: "Devil's Advocate"
    initials: "DA"
    icon: "Flame"
    color: "#AD1457"
    lens: "Forced minority position against emerging consensus"
    output_rubric: "The strongest case for the least popular option"
    preferred_build_role: "critic"

  - id: cost_latency_hawk
    name: "Cost & Latency Hawk"
    initials: "CH"
    icon: "DollarSign"
    color: "#5D4037"
    lens: "Token/time/quota budget, performance"
    output_rubric: "Cost and latency estimate of the approach"
    preferred_build_role: "judge"

  - id: prior_art_researcher
    name: "Prior-Art Researcher"
    initials: "PR"
    icon: "BookOpen"
    color: "#455A64"
    lens: "What has been tried, known failure stories"
    output_rubric: "Precedents and why they succeeded/failed"
    preferred_build_role: "scout"

  - id: maintainer
    name: "Maintainer"
    initials: "MA"
    icon: "Tool"
    color: "#7CB342"
    lens: "Long-term upkeep, readability, migration"
    output_rubric: "Maintenance cost, deprecation/migration notes"
    preferred_build_role: "critic"
